<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>오늘의 조림 관리 · 황동태</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"></head>
<body class="admin-page"><header><a class="brand" href="./"><img class="brand-wordmark" src="assets/hwangdongtae-wordmark.png" alt="황동태" width="1944" height="809"></a><a href="./">홈페이지 보기 ↗</a></header>
<main class="admin-shell"><p class="eyebrow">HWANGDONGTAE · STORE</p><h1>오늘의 조림 관리</h1><p class="admin-intro">오늘 준비한 생선과 판매 상태를 알려주세요.</p>
<p id="admin-message" role="status" aria-live="polite">로그인 상태를 확인하고 있습니다.</p>
<section id="login-panel" hidden><h2>매장 관리자 로그인</h2><form id="login-form"><label for="email">이메일</label><input id="email" type="email" autocomplete="username" required><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required><button class="button gold" type="submit">로그인</button></form><button id="forgot-password" class="text-button">처음 이용하시나요? / 비밀번호 재설정</button><p class="admin-help">지정된 관리자 이메일로 비밀번호 설정 링크를 받으세요.</p></section>
<section id="reset-panel" hidden><h2>새 비밀번호 설정</h2><form id="reset-form"><label for="new-password">새 비밀번호 (12자 이상)</label><input id="new-password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><label for="confirm-password">새 비밀번호 확인</label><input id="confirm-password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><button class="button gold" type="submit">비밀번호 저장</button></form></section>
<section id="editor-panel" hidden><div class="admin-top"><span id="account-name"></span><button id="logout" class="text-button">로그아웃</button></div><div class="published"><span class="eyebrow">현재 게시 상태</span><h2 id="published-title"></h2><p id="published-date"></p></div><form id="menu-form"><label for="fish-name">오늘 준비한 생선</label><input id="fish-name" maxlength="60" required placeholder="예: 갈치, 가자미" autocomplete="off"><p class="admin-help">생선 이름만 입력하세요. ‘조림’은 홈페이지에 자동으로 붙습니다.</p><fieldset><legend>판매 상태</legend><label class="radio-label"><input type="radio" name="sale-status" value="available" checked> 판매 중</label><label class="radio-label"><input type="radio" name="sale-status" value="sold_out"> 오늘 품절</label></fieldset><div class="admin-actions"><button class="button gold" type="submit">오늘 메뉴로 저장</button><button class="button line" id="same-fish" type="button" disabled>오늘도 같은 생선</button></div></form><p class="admin-help">‘오늘도 같은 생선’은 마지막 저장한 생선을 오늘 판매 중으로 등록합니다.<br>매일 한국 시간 자정에 오늘 메뉴 표시가 종료됩니다. 다음 날 다시 확인해 주세요.</p></section>
</main><script type="module" src="assets/admin.bundle.js"></script></body></html>
